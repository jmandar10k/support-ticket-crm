<!DOCTYPE html>

<html>

<head>


<title>Ticket Dashboard</title>
<link
rel="stylesheet"
href="/static/style.css"
>

</head>

<body>

<div class="container">

<h1>

Support CRM Dashboard

</h1>

<p id="welcomeUser"></p>

<button onclick="logout()">
🚪 Logout
</button>

<button

onclick="window.location.href='/create'"

>

+ Create Ticket

</button>


<button

onclick="syncEmails()"

id="syncBtn"

>

Sync Emails

</button>


<br><br>

<input
id="search"
placeholder="Search Tickets"
>

<select id="status">

<option value="">

All Status

</option>

<option>

Open

</option>

<option>

In Progress

</option>

<option>

Closed

</option>

</select>

<button onclick="loadTickets()">

Search

</button>

<br><br>

<table border="1">

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Subject</th>

<th>Status</th>

</tr>

</thead>

<tbody id="ticketTable">

</tbody>

</table>

<hr>

<h2>

🤖 AI Ticket Assistant

</h2>


<div class="chat-container">


<div

id="chatMessages"

class="messages"

>

</div>


<div class="input-area">


<input

id="chatInput"

placeholder=

"Ask about tickets..."

>


<button

onclick="askBot()"

>

Send

</button>


</div>


</div>


</div>

<script src="/static/auth.js"></script>

<script>

checkAuth()

</script>

<script src="/static/index.js">

</script>

</div>
</body>

</html>
